<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precificação Mercado Livre</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .results { background-color: #eafaf1; border: 1px solid #d4efdf; padding: 15px; border-radius: 8px; margin-top: 20px; }
    .results h3 { margin-top: 0; color: #27ae60; }
    .price-highlight { font-size: 1.4em; font-weight: bold; color: #27ae60; text-align: right; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Precificação Mercado Livre</h2>

  <div class="form-group">
    <label for="nome">Nome do Produto / Kit</label>
    <input type="text" id="nome" placeholder="Ex: Ração 10kg">
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" value="20" step="0.1" oninput="calcular()">
    </div>
    <div class="form-group" style="flex: 1;">
      <label for="cmv">CMV / Custo (R$)</label>
      <input type="number" id="cmv" value="105.00" step="0.01" oninput="calcular()">
    </div>
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label for="embalagem">Custo Embalagem (R$)</label>
      <input type="number" id="embalagem" value="1.00" step="0.01" oninput="calcular()">
    </div>
    <div class="form-group" style="flex: 1;">
      <label for="tipoAnuncio">Anúncio</label>
      <select id="tipoAnuncio" onchange="atualizarComissao()">
        <option value="11.5">Clássico (11,5%)</option>
        <option value="16.5">Premium (16,5%)</option>
      </select>
    </div>
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label for="comissao">Comissão (%)</label>
      <input type="number" id="comissao" value="11.5" step="0.1" oninput="calcular()">
    </div>
    <div class="form-group" style="flex: 1;">
      <label for="freteManual">Frete Fixo / Extra (R$)</label>
      <input type="number" id="freteManual" value="0.00" step="0.01" oninput="calcular()">
    </div>
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label for="taxaFixa">Taxa Fixa (&lt; R$79)</label>
      <input type="number" id="taxaFixa" value="6.00" step="0.01" oninput="calcular()">
    </div>
    <div class="form-group" style="flex: 1;">
      <label for="imposto">Imposto (%)</label>
      <input type="number" id="imposto" value="0" step="0.1" oninput="calcular()">
    </div>
  </div>

  <div class="form-group">
    <label for="margem">Margem Desejada (%)</label>
    <input type="number" id="margem" value="25" step="0.1" oninput="calcular()">
  </div>

  <!-- RESULTADOS -->
  <div class="results">
    <h3>2. Resultado do Cálculo</h3>
    
    <div class="row">
      <span>Preço Sugerido:</span>
      <span class="price-highlight" id="resPreco">R$ 0,00</span>
    </div>
    
    <hr style="border: 0; border-top: 1px dashed #ccc; margin: 10px 0;">

    <div class="row">
      <span>Comissão ML:</span>
      <span id="resComissao">R$ 0,00</span>
    </div>
    <div class="row">
      <span>Frete / Taxa Aplicada:</span>
      <span id="resFrete">R$ 0,00</span>
    </div>
    <div class="row">
      <span>Imposto:</span>
      <span id="resImposto">R$ 0,00</span>
    </div>
    <div class="row">
      <span>Custo Total (CMV + Emb):</span>
      <span id="resCustoTotal">R$ 0,00</span>
    </div>

    <div class="row" style="margin-top: 15px; font-weight: bold; font-size: 1.1em; color: #1e8449;">
      <span>Lucro Estimado:</span>
      <span id="resLucro">R$ 0,00</span>
    </div>
  </div>
</div>

<script>
// Tabela Padrão de Frete ML por peso (Envios/Sem Medalha)
function obterFretePorPeso(peso) {
  if (peso <= 0) return 0;
  if (peso <= 0.3) return 19.90;
  if (peso <= 0.5) return 20.90;
  if (peso <= 1.0) return 22.90;
  if (peso <= 2.0) return 24.90;
  if (peso <= 5.0) return 30.90;
  if (peso <= 9.0) return 44.90;
  if (peso <= 13.0) return 58.90;
  if (peso <= 17.0) return 69.90;
  if (peso <= 23.0) return 83.90; // Faixa para 20 kg
  if (peso <= 30.0) return 97.90;
  return 120.00; // Valor base para pesos superiores
}

function atualizarComissao() {
  document.getElementById('comissao').value = document.getElementById('tipoAnuncio').value;
  calcular();
}

function calcular() {
  // Entradas
  const peso = parseFloat(document.getElementById('peso').value) || 0;
  const cmv = parseFloat(document.getElementById('cmv').value) || 0;
  const embalagem = parseFloat(document.getElementById('embalagem').value) || 0;
  const comissaoPct = parseFloat(document.getElementById('comissao').value) || 0;
  const freteManual = parseFloat(document.getElementById('freteManual').value) || 0;
  const taxaFixaPadrao = parseFloat(document.getElementById('taxaFixa').value) || 6.00;
  const impostoPct = parseFloat(document.getElementById('imposto').value) || 0;
  const margemPct = parseFloat(document.getElementById('margem').value) || 0;

  const custoDireto = cmv + embalagem;
  const somaPorcentagens = (comissaoPct + impostoPct + margemPct) / 100;

  if (somaPorcentagens >= 1) {
    alert("A soma das porcentagens (Comissão + Imposto + Margem) não pode ser igual ou maior que 100%.");
    return;
  }

  // 1. Tenta calcular assumindo que o produto é >= R$ 79 (com Frete Grátis por peso)
  let freteML = obterFretePorPeso(peso) + freteManual;
  let precoSugerido = (custoDireto + freteML) / (1 - somaPorcentagens);
  let taxaAplica = freteML;

  // 2. Se o resultado for menor que R$ 79, recalcula aplicando a Taxa Fixa em vez do Frete por Peso
  if (precoSugerido < 79) {
    taxaAplica = taxaFixaPadrao + freteManual;
    precoSugerido = (custoDireto + taxaAplica) / (1 - somaPorcentagens);
  }

  // Totais
  const valorComissao = precoSugerido * (comissaoPct / 100);
  const valorImposto = precoSugerido * (impostoPct / 100);
  const valorLucro = precoSugerido * (margemPct / 100);

  // Renderização
  document.getElementById('resPreco').innerText = `R$ ${precoSugerido.toFixed(2)}`;
  document.getElementById('resComissao').innerText = `R$ ${valorComissao.toFixed(2)}`;
  document.getElementById('resFrete').innerText = `R$ ${taxaAplica.toFixed(2)}`;
  document.getElementById('resImposto').innerText = `R$ ${valorImposto.toFixed(2)}`;
  document.getElementById('resCustoTotal').innerText = `R$ ${custoDireto.toFixed(2)}`;
  document.getElementById('resLucro').innerText = `R$ ${valorLucro.toFixed(2)}`;
}

// Executa o cálculo inicial ao carregar
calcular();
</script>

</body>
</html>

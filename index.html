<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Mercado Livre - Estilo Shopee</title>
    <style>
        :root {
            --primary: #ffee58;
            --primary-dark: #2962ff;
            --header-bg: #1b365d;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --success: #2e7d32;
            --danger: #d32f2f;
            --border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 10px;
            padding-bottom: 40px;
        }

        .header {
            background-color: var(--header-bg);
            color: #ffffff;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.8rem;
            opacity: 0.85;
        }

        /* CARD DE CONFIGURAÇÕES GERAIS */
        .card-config {
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .card-config h2 {
            font-size: 0.95rem;
            color: var(--header-bg);
            margin-bottom: 8px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
        }

        .config-item label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 3px;
        }

        .config-item input, .config-item select {
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* TABELA DE PRODUTOS SIMPLIFICADA */
        .table-container {
            background: #fff;
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 650px;
        }

        th {
            background-color: var(--header-bg);
            color: #fff;
            padding: 8px 6px;
            font-weight: 600;
            text-align: center;
        }

        td {
            padding: 6px 4px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
        }

        td input {
            width: 100%;
            padding: 6px 4px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 0.8rem;
            text-align: center;
        }

        td input.input-prod {
            text-align: left;
        }

        .txt-lucro {
            font-weight: bold;
            color: var(--success);
        }

        .txt-preco {
            font-weight: bold;
            color: var(--header-bg);
        }

        .btn-add {
            background-color: var(--header-bg);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-del {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-del:active, .btn-add:active {
            opacity: 0.8;
        }

        .info-bar {
            font-size: 0.75rem;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Calculadora Mercado Livre</h1>
        <p>Modelo Simplificado Direto na Tabela</p>
    </div>

    <!-- CONFIGURAÇÕES DE IMPOSTO E ANÚNCIO (APLICA A TODOS OS PRODUTOS) -->
    <div class="card-config">
        <h2>Taxas Fixas Padrão</h2>
        <div class="config-grid">
            <div class="config-item">
                <label>Tipo de Anúncio</label>
                <select id="cfgAnuncio" onchange="atualizarTaxasGlobais()">
                    <option value="11.5">Clássico (11.5%)</option>
                    <option value="16.5">Premium (16.5%)</option>
                </select>
            </div>
            <div class="config-item">
                <label>Comissão (%)</label>
                <input type="number" id="cfgComissao" value="11.5" step="0.1" oninput="recalcularTudo()">
            </div>
            <div class="config-item">
                <label>Imposto / Simples (%)</label>
                <input type="number" id="cfgImposto" value="6.0" step="0.1" oninput="recalcularTudo()">
            </div>
            <div class="config-item">
                <label>Margem Alvo (%)</label>
                <input type="number" id="cfgMargem" value="20.0" step="0.1" oninput="recalcularTudo()">
            </div>
        </div>
    </div>

    <!-- TABELA SIMPLIFICADA IGUAL A DA SHOPEE -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 22%;">Produto / Kit</th>
                    <th style="width: 10%;">Peso (kg)</th>
                    <th style="width: 12%;">CMV (R$)</th>
                    <th style="width: 12%;">Frete (R$)</th>
                    <th style="width: 15%;">Preço Sugerido</th>
                    <th style="width: 15%;">Lucro Líquido</th>
                    <th style="width: 8%;">Ação</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- Linhas inseridas via JS -->
            </tbody>
        </table>

        <button class="btn-add" onclick="adicionarLinha()">+ Adicionar Novo Produto</button>
        <div class="info-bar">💡 Digite o Peso, CMV e Frete. A tabela calcula o Preço e o Lucro automaticamente.</div>
    </div>

    <script>
        // Dados armazenados localmente
        let produtos = JSON.parse(localStorage.getItem('ml_shopee_style_prods') || 'null');

        if (!produtos || produtos.length === 0) {
            produtos = [
                { id: 1, nome: "Kit Ração 2kg", peso: 2.0, cmv: 30.00, frete: 21.00 },
                { id: 2, nome: "Kit Ração 6kg", peso: 6.0, cmv: 60.00, frete: 31.00 },
                { id: 3, nome: "Kit Ração 12kg", peso: 12.0, cmv: 110.00, frete: 44.00 }
            ];
        }

        function atualizarTaxasGlobais() {
            const val = document.getElementById('cfgAnuncio').value;
            document.getElementById('cfgComissao').value = val;
            recalcularTudo();
        }

        function renderTabela() {
            const tbody = document.getElementById('corpoTabela');
            tbody.innerHTML = '';

            produtos.forEach((prod, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" class="input-prod" value="${prod.nome}" onchange="atualizarItem(${index}, 'nome', this.value)"></td>
                    <td><input type="number" step="0.1" value="${prod.peso}" oninput="atualizarItem(${index}, 'peso', this.value)"></td>
                    <td><input type="number" step="0.01" value="${prod.cmv}" oninput="atualizarItem(${index}, 'cmv', this.value)"></td>
                    <td><input type="number" step="0.01" value="${prod.frete}" oninput="atualizarItem(${index}, 'frete', this.value)"></td>
                    <td class="txt-preco" id="preco_${index}">R$ 0,00</td>
                    <td class="txt-lucro" id="lucro_${index}">R$ 0,00</td>
                    <td><button class="btn-del" onclick="removerLinha(${index})">✕</button></td>
                `;
                tbody.appendChild(tr);
            });

            recalcularTudo();
        }

        function atualizarItem(index, campo, valor) {
            if (campo === 'nome') {
                produtos[index].nome = valor;
            } else {
                produtos[index][campo] = parseFloat(valor) || 0;
            }
            salvarStorage();
            recalcularLinha(index);
        }

        function recalcularLinha(index) {
            const comissaoPct = (parseFloat(document.getElementById('cfgComissao').value) || 0) / 100;
            const impostoPct = (parseFloat(document.getElementById('cfgImposto').value) || 0) / 100;
            const margemPct = (parseFloat(document.getElementById('cfgMargem').value) || 0) / 100;

            const prod = produtos[index];
            const divisor = 1 - comissaoPct - impostoPct - margemPct;

            let precoSugerido = 0;
            let lucroLiquido = 0;

            if (divisor > 0) {
                precoSugerido = (prod.cmv + prod.frete) / divisor;
                const comissaoR = precoSugerido * comissaoPct;
                const impostoR = precoSugerido * impostoPct;
                lucroLiquido = precoSugerido - (prod.cmv + prod.frete + comissaoR + impostoR);
            }

            document.getElementById(`preco_${index}`).innerText = fmtMoeda(precoSugerido);
            document.getElementById(`lucro_${index}`).innerText = fmtMoeda(lucroLiquido);
        }

        function recalcularTudo() {
            produtos.forEach((_, idx) => recalcularLinha(idx));
        }

        function adicionarLinha() {
            produtos.push({
                id: Date.now(),
                nome: "Novo Kit",
                peso: 1.0,
                cmv: 0.00,
                frete: 0.00
            });
            salvarStorage();
            renderTabela();
        }

        function removerLinha(index) {
            produtos.splice(index, 1);
            salvarStorage();
            renderTabela();
        }

        function salvarStorage() {
            localStorage.setItem('ml_shopee_style_prods', JSON.stringify(produtos));
        }

        function fmtMoeda(val) {
            return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Inicializar tabela
        renderTabela();
    </script>
</body>
</html>

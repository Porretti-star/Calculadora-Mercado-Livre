<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Mercado Livre</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f5f5f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: #fff; padding: 20px; border-radius: 8px; max-width: 450px; width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a237e; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .full { grid-column: span 2; }
    label { font-size: 12px; font-weight: bold; color: #333; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .result-box { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .result-box h3 { color: #2e7d32; margin: 0 0 10px 0; font-size: 16px; }
    .suggested-price { font-size: 20px; font-weight: bold; color: #2e7d32; display: flex; justify-content: space-between; margin-bottom: 10px; }
    .detail-row { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 4px; }
    .profit-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; color: #2e7d32; border-top: 1px dashed #ccc; padding-top: 6px; margin-top: 6px; }
    .btn-save { width: 100%; background: #1a237e; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn-save:hover { background: #0d47a1; }
    .btn-clear { width: 100%; background: #c62828; color: #fff; border: none; padding: 8px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .history { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .history h4 { margin: 0; color: #1a237e; }
    .history-item { background: #f9f9f9; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>Calculadora Mercado Livre</h2>

  <div class="grid">
    <div class="full">
      <label>Nome do Produto / Kit</label>
      <input type="text" id="nomeProduto" placeholder="Ex: Gato Bill 2kg">
    </div>
    <div>
      <label>Peso (kg)</label>
      <input type="number" id="peso" value="2" step="0.1">
    </div>
    <div>
      <label>CMV / Custo (R$)</label>
      <input type="number" id="custo" value="10.50" step="0.01">
    </div>
    <div>
      <label>Custo Embalagem (R$)</label>
      <input type="number" id="embalagem" value="1.00" step="0.01">
    </div>
    <div>
      <label>Anúncio</label>
      <select id="tipoAnuncio">
        <option value="11.5">Clássico (11.5%)</option>
        <option value="16.5">Premium (16.5%)</option>
      </select>
    </div>
    <div>
      <label>Comissão (%)</label>
      <input type="number" id="comissao" value="11.5" readonly>
    </div>
    <div>
      <label>Frete Extra (R$)</label>
      <input type="number" id="freteExtra" value="0.00" step="0.01">
    </div>
    <div>
      <label>Imposto (%)</label>
      <input type="number" id="imposto" value="0" step="0.1">
    </div>
    <div>
      <label>Margem Desejada (%)</label>
      <input type="number" id="margem" value="20" step="0.1">
    </div>
  </div>

  <div class="result-box">
    <h3>Resultado do Cálculo</h3>
    <div class="suggested-price">
      <span>Preço Sugerido:</span>
      <span id="resPreço">R$ 0,00</span>
    </div>
    <div class="detail-row"><span>Comissão ML:</span> <span id="resComissao">R$ 0,00</span></div>
    <div class="detail-row"><span>Frete Envios:</span> <span id="resFrete">R$ 0,00</span></div>
    <div class="detail-row"><span>Taxa Fixa (&lt; R$79):</span> <span id="resTaxaFixa">R$ 0,00</span></div>
    <div class="detail-row"><span>Imposto:</span> <span id="resImposto">R$ 0,00</span></div>
    <div class="detail-row"><span>Custo Total (CMV + Emb):</span> <span id="resCustoTotal">R$ 0,00</span></div>
    <div class="profit-row"><span>Lucro Estimado:</span> <span id="resLucro">R$ 0,00</span></div>
  </div>

  <button class="btn-save" id="btnSalvar">Salvar Cálculo</button>

  <div class="history">
    <div class="history-header">
      <h4>Cálculos Salvos</h4>
    </div>
    <div id="listaHistorico"></div>
    <button class="btn-clear" id="btnLimpar">Limpar Todo o Histórico</button>
  </div>
</div>

<script>
  function obterCustoFretePorPeso(peso) {
    if (peso <= 0.5) return 18.90;
    if (peso <= 1.0) return 21.90;
    if (peso <= 2.0) return 24.90;
    if (peso <= 5.0) return 30.90;
    return 40.00;
  }

  function formatarMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function calcular() {
    const peso = parseFloat(document.getElementById('peso').value) || 0;
    const custo = parseFloat(document.getElementById('custo').value) || 0;
    const embalagem = parseFloat(document.getElementById('embalagem').value) || 0;
    const pctComissao = parseFloat(document.getElementById('comissao').value) || 0;
    const freteExtra = parseFloat(document.getElementById('freteExtra').value) || 0;
    const pctImposto = parseFloat(document.getElementById('imposto').value) || 0;
    const pctMargem = parseFloat(document.getElementById('margem').value) || 0;

    const custoDireto = custo + embalagem;
    const taxaFixaBase = 6.00;
    const divisorAbaixo79 = 1 - ((pctComissao + pctImposto + pctMargem) / 100);
    
    let precoSugerido = (custoDireto + freteExtra + taxaFixaBase) / (divisorAbaixo79 || 1);
    let freteEnvios = 0;
    let taxaFixa = taxaFixaBase;

    if (precoSugerido >= 79) {
      taxaFixa = 0;
      freteEnvios = obterCustoFretePorPeso(peso);
      precoSugerido = (custoDireto + freteExtra + freteEnvios) / (divisorAbaixo79 || 1);
    }

    const valorComissao = precoSugerido * (pctComissao / 100);
    const valorImposto = precoSugerido * (pctImposto / 100);
    const valorLucro = precoSugerido * (pctMargem / 100);

    // Apenas atualiza a tela (SEM SALVAR no localStorage)
    document.getElementById('resPreço').innerText = formatarMoeda(precoSugerido);
    document.getElementById('resComissao').innerText = formatarMoeda(valorComissao);
    document.getElementById('resFrete').innerText = formatarMoeda(freteEnvios);
    document.getElementById('resTaxaFixa').innerText = formatarMoeda(taxaFixa);
    document.getElementById('resImposto').innerText = formatarMoeda(valorImposto);
    document.getElementById('resCustoTotal').innerText = formatarMoeda(custoDireto);
    document.getElementById('resLucro').innerText = formatarMoeda(valorLucro);
  }

  // Atualização dos inputs (apenas recalculam a visualização)
  document.getElementById('tipoAnuncio').addEventListener('change', (e) => {
    document.getElementById('comissao').value = e.target.value;
    calcular();
  });

  const inputs = document.querySelectorAll('input');
  inputs.forEach(input => input.addEventListener('input', calcular));

  // Salvamento EXCLUSIVO via clique no botão
  document.getElementById('btnSalvar').addEventListener('click', () => {
    const nomeInput = document.getElementById('nomeProduto').value.trim();
    const nome = nomeInput !== "" ? nomeInput : "Produto sem nome";

    const itemSalvo = {
      nome: nome,
      preco: document.getElementById('resPreço').innerText,
      lucro: document.getElementById('resLucro').innerText,
      data: new Date().toLocaleDateString('pt-BR')
    };

    let historico = JSON.parse(localStorage.getItem('calculosML')) || [];
    historico.push(itemSalvo);
    localStorage.setItem('calculosML', JSON.stringify(historico));

    renderizarHistorico();
  });

  // Limpar todo o histórico acumulado com erro
  document.getElementById('btnLimpar').addEventListener('click', () => {
    if (confirm("Deseja apagar todos os cálculos salvos?")) {
      localStorage.removeItem('calculosML');
      renderizarHistorico();
    }
  });

  function renderizarHistorico() {
    const container = document.getElementById('listaHistorico');
    const historico = JSON.parse(localStorage.getItem('calculosML')) || [];

    if (historico.length === 0) {
      container.innerHTML = '<p style="font-size:12px; color:#888;">Nenhum cálculo salvo ainda.</p>';
      return;
    }

    container.innerHTML = historico.map((item) => `
      <div class="history-item">
        <div>
          <strong>${item.nome}</strong><br>
          <small style="color:#666">${item.data || 'Sem data'}</small>
        </div>
        <div style="text-align:right">
          <span style="color:#2e7d32; font-weight:bold">${item.preco}</span><br>
          <small style="color:#2e7d32">Lucro: ${item.lucro}</small>
        </div>
      </div>
    `).join('');
  }

  // Inicialização
  calcular();
  renderizarHistorico();
</script>

</body>
</html>
